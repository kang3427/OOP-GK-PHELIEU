name: Java smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile source and tests
        run: |
          mkdir -p out
          find src tests -name '*.java' -print0 | xargs -0 javac -d out
      - name: Run business rules smoke test
        run: java -cp out BusinessRulesSmokeTest
      - name: Run application demo
        run: java -cp out Main
